name: Build TShock Plugin DLL

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Restore and Build DLL
        run: dotnet build EyeBossTrueEyeAllPlayers.csproj -c Release

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: EyeBossTrueEyeAllPlayers-dll
          path: bin/Release/**/*.dll
          
