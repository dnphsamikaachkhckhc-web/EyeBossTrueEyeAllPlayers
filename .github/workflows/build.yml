name: Build Plugin

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Download OTAPI.dll
        run: curl -fL "https://github.com/dnphsamikaachkhckhc-web/EyeBossTrueEyeAllPlayers/releases/download/1.0/OTAPI.dll" -o OTAPI.dll

      - name: Restore and Build DLL
        run: dotnet build EyeBossTrueEyeAllPlayers.csproj -c Release -o out

      - name: Upload DLL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EyeBossTrueEyeAllPlayers-dll
          path: out/EyeBossTrueEyeAllPlayers.dll
